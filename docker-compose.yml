# 扫码登录面板 · 应用宝扫码 → 青龙（美团改成青龙里跑脚本，面板只留签名接口）
#
# 启动：docker compose up -d --build
# 入口：http://<服务器IP>:5180       管理后台 /admin
#
# 网络：panel 服务同时加入自建网络 panel 与青龙已有的 qinglong_default，
#       因此既能在面板里用 http://qinglong-web-1:5700 访问青龙，
#       也能让青龙容器内的脚本用 http://yyb-go:8000 访问应用宝网关。

services:
  yyb-go:
    build:
      context: ./yyb_go
    image: script-yyb-go:latest
    container_name: scan-yyb-go
    restart: unless-stopped
    volumes:
      # 只持久化账号库与头像；二维码/模板留在容器层即可
      - ./data/yyb/db:/app/resource/db
      - ./data/yyb/avatars:/app/resource/avatars
    environment:
      # 动态出口（品赞国内住宅 IP）：取 code / 续期走国内出口，降低海外 IP 被风控的概率。
      # 值放同目录 .env（已被 .gitignore 忽略，禁止提交），留空则退回直连/静态代理。
      YYB_IPZAN_EXTRACT_URL: ${YYB_IPZAN_EXTRACT_URL:-}
      YYB_IPZAN_RELAY: ${YYB_IPZAN_RELAY:-}
      YYB_IPZAN_PROXY_SCHEME: ${YYB_IPZAN_PROXY_SCHEME:-http-connect}
    networks:
      - panel
      - qinglong

  panel:
    build:
      context: ./panel
    image: script-scan-panel:latest
    container_name: scan-panel
    restart: unless-stopped
    depends_on:
      - yyb-go
    ports:
      # 只绑回环：对外统一走宿主机 nginx（scan.example.com），不直接暴露面板
      - "127.0.0.1:5180:5180"
    environment:
      PORT: "5180"
      TZ: Asia/Shanghai
      # 面板后台「青龙面板地址」的初始默认值
      PANEL_QINGLONG_HOST: http://qinglong-web-1:5700
      # 面板服务端到应用宝网关的地址（走 compose 内网）
      PANEL_YYB_BASE_URL: http://yyb-go:8000
      # 扫码成功后写进青龙 yyb_server 的值：青龙容器里能解析的地址
      PANEL_YYB_PUBLIC_BASE_URL: http://yyb-go:8000
    volumes:
      - ./data/panel:/app/data
      # 美团专家包目录：面板不再做美团扫码登录，只借它的 vendor/cliguard/js/cliguard.js
      # 给青龙里的 meituan_code.js 提供 mtgsig 签名。缺失时只是签名接口不可用。
      - ./meituan-expert:/opt/meituan-expert
    networks:
      - panel
      - qinglong

  # 可选：用 Cloudflare Tunnel 把面板挂到自定义域名（不开任何入站端口）。
  # 默认不启动 —— 需要时显式带上 profile：
  #   docker compose --profile tunnel up -d
  #
  # 连接器 token 放在同目录 .env（已被 .gitignore 忽略，勿提交）：
  #   CF_TUNNEL_TOKEN=<cloudflared 隧道 token>
  #
  # 注意：宿主机已有 nginx 反代（scan.example.com → 127.0.0.1:5180）时不需要它。
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: scan-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - panel
    environment:
      # cloudflared 会直接读这个环境变量，避免 token 出现在命令行里
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
      TZ: Asia/Shanghai
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    networks:
      - panel

networks:
  panel:
    name: script_panel
  qinglong:
    external: true
    name: qinglong_default
