const PANELS = [

  { id: 'accounts', name: '应用宝账号', sub: '管理已扫码入库的微信账号', icon: ICONS.users, save: false },

let cfg = null;
let current = 'overview';

async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok || !data || data.ok !== true) {
    const err = new Error((data && data.error) || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return data.data;
}

/* ---------- DOM 小工具 ---------- */

function node(tag, props, children) {
  const n = document.createElement(tag);
  if (props) for (const k of Object.keys(props)) {
    const v = props[k];
    if (v === undefined || v === null) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'style') n.setAttribute('style', v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of (children || [])) if (c) n.appendChild(c);
  return n;
}

/**
 * 自定义下拉框（替代原生 select —— 原生控件在各浏览器里样式不可控，太丑）。
 * 返回 { el, value }：value 可读可写，行为跟原生 select 一致，方便替换。
 */
function dropdown(opts) {
  const o = opts || {};
  const label = node('span', { class: 'dd-label' });
  const caret = node('span', {
    class: 'dd-caret',
    html: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  });
  const btn = node('button', { class: 'dd-btn', type: 'button', 'aria-haspopup': 'listbox' }, [label, caret]);
  const menu = node('div', { class: 'dd-menu', role: 'listbox' });
  const wrap = node('div', { class: 'dd' }, [btn, menu]);

  let value = o.value;
  const items = (o.options || []).map((opt) => {
    const el = node('button', { class: 'dd-item', type: 'button', role: 'option' }, [
      node('span', { text: opt.label }),
    ]);
    el.addEventListener('click', () => {
      value = opt.value;
      paint();
      close();
      if (o.onChange) o.onChange(opt.value);
    });
    return { opt, el };
  });

  function paint() {
    const hit = items.find((i) => i.opt.value === value);
    label.textContent = hit ? hit.opt.label : (o.placeholder || '请选择');
    for (const i of items) {
      const on = i.opt.value === value;
      i.el.classList.toggle('active', on);
      const tick = i.el.querySelector('.tick');
      if (on && !tick) i.el.appendChild(node('span', { class: 'tick', text: '✓' }));
      else if (!on && tick) tick.remove();
    }
  }

  function onDoc(e) { if (!wrap.contains(e.target)) close(); }
  function onKey(e) { if (e.key === 'Escape') close(); }
  function open() {
    closeAllDropdowns();
    wrap.classList.add('open');
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onKey);
  }
  function close() {
    wrap.classList.remove('open');
    document.removeEventListener('mousedown', onDoc);
    document.removeEventListener('keydown', onKey);
  }
  btn.addEventListener('click', () => (wrap.classList.contains('open') ? close() : open()));

  menu.appendChild(node('div', {}, items.map((i) => i.el)));
  paint();

  const api = {
    el: wrap,
    get value() { return value; },
    set value(v) { value = v; paint(); },
    close,
  };
  openDropdowns.push(api);
  return api;
}

const openDropdowns = [];
function closeAllDropdowns() { for (const d of openDropdowns) d.close(); }

function noteBox(kind, lines) {
  const box = node('div', { class: 'note ' + kind, style: 'margin-top:14px' });
  for (const line of (lines || [])) {
    // 允许调用方用 `cond ? '文案' : null` 这种写法，空值直接跳过，
    // 否则 appendChild(null) 会抛 "parameter 1 is not of type 'Node'"
    if (line === null || line === undefined || line === false || line === '') continue;
    box.appendChild(typeof line === 'string' || typeof line === 'number'
      ? node('div', { text: String(line) })
      : line);
  }
  return box;
}

function show(out, kind, lines) {
  out.innerHTML = '';
  out.appendChild(noteBox(kind, lines));
}

function field(label, inputEl, desc) {
  return node('div', { class: 'field' }, [
    node('label', { text: label }),
    inputEl,
    desc ? node('div', { class: 'desc', text: desc }) : null,
  ]);
}

function input(id, opts) {
  const o = opts || {};
  const attrs = Object.assign({ type: 'text', id: id, autocomplete: 'off' }, o.attrs || {});
  const i = node('input', attrs);
  if (o.value) i.value = o.value;
  return i;
}

function stat(label, value, dotKind) {
  return node('div', { class: 'stat' }, [
    node('div', { class: 'stat-label' }, [
      dotKind ? node('span', { class: 'dot ' + dotKind }) : null,
      node('span', { text: label }),
    ]),
    node('div', { class: 'stat-value', text: value }),
  ]);
}

function testButton(text, run) {
  const out = node('div');
  const btn = node('button', {
    class: 'btn ghost small', text: text,
    onclick: async () => {
      btn.disabled = true;
      show(out, 'info', ['正在检测…']);
      try {
        const lines = await run();
        show(out, 'ok', lines.filter(Boolean));
      } catch (e) {
        show(out, 'err', [e.message]);
      }
      btn.disabled = false;
    },
  });
  return node('div', {}, [node('div', { class: 'row' }, [btn]), out]);
}

/* ---------- 登录 / 初始化 ---------- */

function renderAuth(kind) {
  document.body.classList.remove('admin');
  app.innerHTML = '';
  const isSetup = kind === 'setup';
  const pw = input('pw', { attrs: { type: 'password' } });
  const pw2 = input('pw2', { attrs: { type: 'password' } });
  const out = node('div');

  const submit = async (ev) => {
    ev.target.disabled = true;
    try {
      if (isSetup) await api('POST', '/api/admin/setup', { password: pw.value, confirm: pw2.value });
      else await api('POST', '/api/admin/login', { password: pw.value });
      await boot();
    } catch (e) {
      show(out, 'err', [e.message]);
      ev.target.disabled = false;
    }
  };

  const card = node('div', { class: 'card' }, [
    node('h2', { text: isSetup ? '首次使用：设置管理员密码' : '管理员登录' }),
    node('div', { class: 'hint', text: isSetup ? '这个密码用来保护下面的青龙凭据配置，请妥善保存。' : '输入初始化时设置的管理员密码。' }),
    field('管理员密码', pw, isSetup ? '至少 8 位' : null),
    isSetup ? field('确认密码', pw2) : null,
    node('div', { class: 'row' }, [
      node('button', { class: 'btn', text: isSetup ? '设置并进入后台' : '登录', onclick: submit }),
    ]),
    out,
  ]);

  pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') card.querySelector('button.btn').click(); });

  app.appendChild(node('div', { class: 'wrap' }, [
    node('h1', { class: 'page-title', text: '管理后台' }),
    node('p', { class: 'page-sub', text: '配置青龙面板凭据与两个扫码通道，普通用户扫码后即可自动写入。' }),
    card,
    node('div', { class: 'footer' }, [node('a', { href: '/', text: '← 返回扫码页' })]),
  ]));
  pw.focus();
}

/* ---------- 后台三个壳 ---------- */

function renderShell() {
  document.body.classList.add('admin');
  app.innerHTML = '';

  // 顶栏只放 logo 与前后台切换；功能菜单在左侧
  const appbar = node('header', { class: 'appbar' }, [
    node('a', { class: 'appbar-brand', href: '/' }, [
      node('span', { class: 'logo', html: ICONS.grid.replace('width="16" height="16"', 'width="17" height="17"') }),
      node('span', { class: 'name', text: '扫码面板' }),
      node('span', { class: 'sub', text: '管理后台' }),
    ]),
    node('span', { class: 'appbar-spacer' }),
    node('nav', { class: 'seg' }, [
      node('a', { href: '/', text: '前台' }),
      node('a', { href: '/admin', class: 'active', 'aria-current': 'page', text: '后台' }),
    ]),
  ]);

  const navItems = PANELS.map((p) => node('button', {
    class: 'nav-item' + (p.id === current ? ' active' : ''),
    'data-panel': p.id,
    html: '<span class="ico">' + p.icon + '</span><span>' + p.name + '</span>',
    onclick: () => activate(p.id),
  }));

  const nav = node('aside', { class: 'admin-nav' }, [
    ...navItems,
    node('div', { class: 'nav-foot' }, [
      node('a', { class: 'nav-item', href: '/', html: '<span class="ico">↗</span><span>打开扫码页</span>' }),
    ]),
  ]);

  const saveBtn = node('button', { class: 'btn small', text: '保存配置', onclick: doSave });
  const head = node('header', { class: 'admin-head' }, [
    node('div', {}, [
      node('h1', { id: 'panelTitle', text: '' }),
      node('div', { class: 'sub', id: 'panelSub', text: '' }),
    ]),
    node('div', { class: 'head-actions' }, [saveBtn]),
  ]);

  const main = node('main', { class: 'admin-main' }, [head, node('div', { id: 'panels' })]);
  app.appendChild(node('div', { class: 'admin-shell' }, [
    appbar,
    node('div', { class: 'admin-body' }, [nav, main]),
  ]));

  const body = $('panels');
  body.appendChild(buildOverview());
  body.appendChild(buildAccounts());
  body.appendChild(buildQinglong());
  body.appendChild(buildProxy());
  body.appendChild(buildSecurity());

  activateFromHash();
}

function activate(id, push) {
  const meta = PANELS.find((p) => p.id === id) || PANELS[0];
  id = meta.id;
  current = id;
  for (const b of document.querySelectorAll('.nav-item[data-panel]')) {
    b.classList.toggle('active', b.dataset.panel === id);
  }
  for (const p of document.querySelectorAll('.panel')) {
    p.classList.toggle('hidden', p.dataset.panel !== id);
  }
  $('panelTitle').textContent = meta.name;
  $('panelSub').textContent = meta.sub;
  const actions = document.querySelector('.head-actions');
  actions.style.display = meta.save ? '' : 'none';
  // 用 hash 记录当前位置，刷新后仍停在同一个面板
  if (push !== false) history.replaceState({ panel: id }, '', '#' + id);
  if (id === 'overview') refreshOverview();
  if (id === 'accounts') loadAccounts();
  if (id === 'proxy') loadProxy();
}

function activateFromHash() {
  const hash = location.hash.replace('#', '');
  activate(PANELS.some((p) => p.id === hash) ? hash : 'overview', false);
}

/* ---------- 概览 ---------- */

let overviewGrid = null;

function buildOverview() {
  const grid = node('div', { class: 'stat-grid' });
  overviewGrid = grid;

  const hint = node('div', { class: 'card' }, [
    node('h2', { text: '从这里开始' }),
    node('div', { class: 'hint', text: '按顺序配置下面两项，然后打开扫码页让用户扫码即可。配置项会写入本机 data/config.json（0600）。' }),
    node('div', { class: 'row' }, [
      node('button', { class: 'btn small ghost', text: '去配置青龙面板', onclick: () => activate('qinglong') }),
    ]),
  ]);

  return node('section', { class: 'panel', 'data-panel': 'overview' }, [grid, hint]);
}

function refreshOverview() {
  if (!overviewGrid) return;
  overviewGrid.innerHTML = '';
  overviewGrid.appendChild(stat('青龙面板', cfg.qinglong.host || '未配置', cfg.qinglong.host && cfg.qinglong.clientSecretSet ? 'ok' : 'err'));
  overviewGrid.appendChild(stat('Client ID', cfg.qinglong.clientId || '未配置', cfg.qinglong.clientId ? 'ok' : 'err'));
  overviewGrid.appendChild(stat('Client Secret', cfg.qinglong.clientSecretSet ? '已保存' : '未配置', cfg.qinglong.clientSecretSet ? 'ok' : 'err'));
  overviewGrid.appendChild(stat('应用宝网关', cfg.yyb.baseUrl || '未配置', cfg.yyb.baseUrl ? 'ok' : 'err'));
  overviewGrid.appendChild(stat('写入青龙的地址', cfg.yyb.publicBaseUrl || '（跟随网关地址）', cfg.yyb.publicBaseUrl ? 'ok' : 'warn'));

  // 美团签名服务是异步探测的，先占位再回填
  const signStat = stat('美团签名服务', '检查中…', 'warn');
  overviewGrid.appendChild(signStat);
  api('GET', '/api/meituan/sign/health').then((r) => {
    const val = signStat.querySelector('.stat-value');
    const dot = signStat.querySelector('.dot');
    if (val) val.textContent = r.available ? '可用' : '不可用';
    if (dot) dot.className = 'dot ' + (r.available ? 'ok' : 'err');
  }).catch(() => {
    const val = signStat.querySelector('.stat-value');
    const dot = signStat.querySelector('.dot');
    if (val) val.textContent = '不可用';
    if (dot) dot.className = 'dot err';
  });
}

/* ---------- 青龙面板 ---------- */

let qlHost, qlId, qlSecret, qlOut;

function buildQinglong() {
  qlHost = input('qlHost', { value: cfg.qinglong.host, attrs: { placeholder: 'http://qinglong-web-1:5700' } });
  qlId = input('qlId', { value: cfg.qinglong.clientId, attrs: { placeholder: '青龙后台新建应用后得到的 Client ID' } });
  qlSecret = input('qlSecret', { attrs: { type: 'password', placeholder: cfg.qinglong.clientSecretSet ? '已保存，留空表示不修改' : '请输入 Client Secret' } });
  qlOut = node('div');

  const clearBtn = cfg.qinglong.clientSecretSet ? node('button', {
    class: 'btn ghost small', text: '清除已保存的 Secret',
    onclick: async () => { await api('POST', '/api/admin/config/clear-secret'); await boot(); activate('qinglong'); },
  }) : null;

  return node('section', { class: 'panel hidden', 'data-panel': 'qinglong' }, [
    node('div', { class: 'card' }, [
      node('h2', { text: '青龙面板 OpenAPI' }),
      node('div', { class: 'hint', text: '青龙后台：系统设置 → 应用设置 → 新建应用，拿到 Client ID 与 Client Secret。' }),
      field('面板地址 host', qlHost, '可以写 http://ip:5700，也可以只写 ip:5700；容器里默认走 compose 内网服务名'),
      field('Client ID', qlId),
      field('Client Secret', qlSecret, cfg.qinglong.clientSecretSet ? '已配置，留空则不修改' : '保存后不会再回传到前端，只显示「已保存」'),
      node('div', { class: 'row' }, [
        node('button', {
          class: 'btn ghost small', text: '测试连接',
          onclick: async (ev) => {
            ev.target.disabled = true;
            show(qlOut, 'info', ['正在连接…']);
            if (await doSave(true)) {
              try {
                const r = await api('POST', '/api/admin/test/qinglong');
                show(qlOut, 'ok', [
                  '连接成功：' + r.host,
                  '鉴权接口：' + r.endpoint + (r.flavor === 'open' ? '（新版 /open 前缀）' : '（老版 /api 前缀）'),
                  '面板版本：' + (r.version || '未知') + (r.branch ? '（' + r.branch + '）' : ''),
                  '已有环境变量：' + (r.envCount >= 0 ? r.envCount + ' 条' : '读取失败'),
                  r.envError ? '环境变量读取告警：' + r.envError : null,
                  r.yyb_server && r.yyb_server.ok
                    ? (r.yyb_server.skipped
                        ? 'yyb_server 已存在，保持青龙里的配置不动'
                        : '已兜底新建 yyb_server = ' + r.yyb_server.value)
                    : (r.yyb_server && r.yyb_server.error ? 'yyb_server 兜底失败：' + r.yyb_server.error : null),
                ]);
              } catch (e) { show(qlOut, 'err', [e.message]); }
            }
            ev.target.disabled = false;
          },
        }),
        clearBtn,
      ]),
      qlOut,
    ]),
  ]);
}

/* ---------- 国内出口（品赞） ---------- */

let proxyRows, proxyOut, proxyScanCb, proxyCodeCb, proxyConfigured = false;

function proxySwitchRow(title, hint, onChange) {
  const cb = node('input', { type: 'checkbox', style: 'margin-top:3px;flex:0 0 auto' });
  cb.addEventListener('change', () => onChange(cb.checked, cb));
  const row = node('label', { style: 'display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer' }, [
    cb,
    node('div', { style: 'flex:1' }, [
      node('div', { text: title, style: 'font-weight:500' }),
      node('div', { text: hint, style: 'font-size:12px;color:var(--muted);line-height:1.6;margin-top:2px' }),
    ]),
  ]);
  return { cb, row };
}

function buildProxy() {
  proxyRows = node('div', { style: 'margin:14px 0 4px' });
  proxyOut = node('div');

  const scan = proxySwitchRow(
    '扫码走代理',
    '扫码登录这条链路（建会话 / 取二维码 / 轮询 / 换登录态）也走国内住宅出口。注意：走代理会慢一些（实测 6~39 秒，直连约 1 秒），失败会自动回退直连。',
    (v) => saveProxySettings({ scan_via_proxy: v }, scan.cb)
  );
  proxyScanCb = scan.cb;

  const code = proxySwitchRow(
    '取 code / 续期走代理',
    '脚本取 code、登录态续期走国内住宅出口（推荐开启：这是微信风控最关注的高频动作）。',
    (v) => saveProxySettings({ code_via_proxy: v }, code.cb)
  );
  proxyCodeCb = code.cb;

  const btn = (text, fn) => node('button', { class: 'btn small ghost', text, style: 'font-size:12px;padding:5px 10px', onclick: fn });

  return node('section', { class: 'panel hidden', 'data-panel': 'proxy' }, [
    node('div', { class: 'card' }, [
      node('h2', { text: '国内出口（品赞住宅 IP）' }),
      node('div', { class: 'hint', text: '服务器在海外，取 code / 扫码若都从美国 IP 直连腾讯，容易被风控——账号会过几天就失效。开启后流量走「树脂跳板 → 品赞国内住宅出口 → 腾讯」。开关即时生效，不用重启。' }),
      proxyRows,
      scan.row,
      code.row,
      node('div', { class: 'row', style: 'margin-top:14px' }, [
        btn('刷新状态', (e) => loadProxy(e.target)),
        btn('立即换出口', (e) => doProxyAction(e.target, '/api/yyb/proxy/refresh', '正在换出口…')),
        btn('测试链路', (e) => doProxyAction(e.target, '/api/yyb/proxy/probe', '正在用当前出口连一次微信 IP…')),
      ]),
      proxyOut,
    ]),
  ]);
}

async function loadProxy(btn) {
  if (btn) btn.disabled = true;
  try {
    const d = await api('GET', '/api/yyb/proxy');
    proxyConfigured = !!d.configured;
    proxyRows.innerHTML = '';
    const line = (k, v, kind) => proxyRows.appendChild(node('div', { class: 'stat-row', style: 'display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)' }, [
      node('span', { text: k, style: 'color:var(--muted);font-size:13px' }),
      node('span', { text: v, style: 'font-size:13px;text-align:right;word-break:break-all' + (kind === 'err' ? ';color:var(--danger,#c0392b)' : '') }),
    ]));

    if (!d.configured) {
      line('状态', '未配置动态出口（服务器 .env 里没填提取接口）');
      proxyScanCb.disabled = true;
      proxyCodeCb.disabled = true;
      line('扫码走代理', '—');
      line('取 code 走代理', '—');
    } else {
      line('状态', '已启用');
      line('当前出口', d.current || '暂无（正在提取/提取失败）');
      if (typeof d.expires_in_seconds === 'number') {
        line('剩余有效', d.expires_in_seconds > 0 ? Math.round(d.expires_in_seconds) + ' 秒' : '已过期');
      }
      if (d.last_extract_at) line('上次提取', String(d.last_extract_at).replace('T', ' ').slice(0, 19));
      if (d.last_err) line('上次错误', String(d.last_err), 'err');
      proxyScanCb.disabled = false;
      proxyCodeCb.disabled = false;
      proxyScanCb.checked = !!d.scan_via_proxy;
      proxyCodeCb.checked = !!d.code_via_proxy;
      line('扫码走代理', d.scan_via_proxy ? '开启' : '关闭');
      line('取 code 走代理', d.code_via_proxy ? '开启' : '关闭');
    }
  } catch (e) {
    show(proxyOut, 'err', ['读取代理状态失败：' + e.message]);
  }
  if (btn) btn.disabled = false;
}

async function saveProxySettings(patch, checkbox) {
  if (checkbox) checkbox.disabled = true;
  try {
    await api('POST', '/api/yyb/proxy/settings', patch);
    show(proxyOut, 'ok', ['✅ 已保存，立即生效']);
    await loadProxy();
  } catch (e) {
    show(proxyOut, 'err', ['保存失败：' + e.message]);
    if (checkbox) checkbox.checked = !checkbox.checked;
  }
  if (checkbox) checkbox.disabled = false;
}

async function doProxyAction(btn, url, tip) {
  btn.disabled = true;
  show(proxyOut, 'info', [tip]);
  try {
    const d = await api('POST', url);
    if (url.endsWith('/probe')) {
      const ok = d && d.ok;
      show(proxyOut, ok ? 'ok' : 'err', [
        ok
          ? `✅ 链路可用：${d.target}（${d.elapsed_ms}ms）`
          : `❌ 链路不通：${(d && d.error) || '未知错误'}`,
        d && d.chain ? '链路：' + d.chain : '',
      ]);
    } else {
      show(proxyOut, 'ok', ['✅ 已换出口：' + ((d && d.current) || '—')]);
    }
    await loadProxy();
  } catch (e) {
    show(proxyOut, 'err', ['操作失败：' + e.message]);
  }
  btn.disabled = false;
}

/* ---------- 应用宝账号 ---------- */

let acctListEl, acctOut, acctFileInput, acctScriptsInput;
let dragRef = null;

/* ---------- 「账号跑哪些脚本」的列定义 ---------- */

/** 当前生效的脚本列（key 必须和脚本自报的一致） */
function scriptDefs() {
  const list = (cfg && cfg.yyb && Array.isArray(cfg.yyb.scripts)) ? cfg.yyb.scripts : [];
  return list.filter((s) => s && s.key);
}

function scriptName(key) {
  const hit = scriptDefs().find((s) => s.key === key);
  return (hit && hit.name) || key;
}

/** 数组 → 输入框文本：mt=美团, sfsy=顺丰 */
function scriptsToText(list) {
  return (list || []).map((s) => (s.name && s.name !== s.key ? s.key + '=' + s.name : s.key)).join(', ');
}

/** 输入框文本 → 数组：mt=美团, sfsy=顺丰（也接受只写 key） */
function textToScripts(text) {
  return String(text || '')
    .split(/[,，;；]+/)
    .map((part) => {
      const i = part.indexOf('=');
      const key = (i === -1 ? part : part.slice(0, i)).trim().toLowerCase();
      const name = (i === -1 ? '' : part.slice(i + 1)).trim();
      return { key, name: name || key };
    })
    .filter((s) => s.key);
}

/** 账号的标记串 → key 数组（逗号 / 空格混用都能解析） */
function parseTags(value) {
  return String(value || '')
    .split(/[,，;；\s]+/)
    .map((s) => s.trim().toLowerCase())
    .filter(Boolean);
}

/** 标记串 → 给人看的说明 */
function describeTags(value) {
  const tags = parseTags(value);
  if (!tags.length) return '全部脚本';
  return '只跑：' + tags.map(scriptName).join('、');
}

let acctData = [];
let acctStatsEl, acctFilterSel, keepAliveEl;

function buildAccounts() {
  acctOut = node('div');
  acctListEl = node('div');
  acctFileInput = node('input', {
    type: 'file',
    accept: '.json,application/json',
    style: 'display:none',
    onchange: (e) => importAccounts(e.target),
  });
  acctScriptsInput = input('acctScripts', { value: scriptsToText(scriptDefs()) });

  acctStatsEl = node('div', { class: 'acct-stats' });
  keepAliveEl = node('div');
  acctFilterSel = dropdown({
    value: 'all',
    options: [
      { value: 'all', label: '全部状态' },
      { value: 'alive', label: '存活' },
      { value: 'expired', label: '已失效' },
      { value: 'unknown', label: '待定' },
    ],
    onChange: () => renderAccounts(acctData),
  });

  const card = node('div', { class: 'card' }, [
    node('h2', { text: '应用宝账号' }),
    node('div', { class: 'hint', text: '扫码登录后存进 yyb_go 网关的微信账号；青龙脚本通过 yyb_server 调它取 code。拖动卡片左侧手柄可以调整顺序（脚本按这个顺序依次执行）。' }),
    acctStatsEl,
    keepAliveEl,
    node('div', { class: 'acct-toolbar' }, [
      node('button', { class: 'btn small ghost', text: '刷新列表', onclick: (e) => loadAccounts(e.target) }),
      node('button', {
        class: 'btn small ghost', text: '刷新全部登录态',
        onclick: (e) => doAccountAction(e.target, '/api/yyb/accounts/refresh', '', '正在逐个探测登录态，多账号会比较慢…'),
      }),
      node('button', {
        class: 'btn small ghost', text: '同步全部资料',
        onclick: (e) => doAccountAction(e.target, '/api/yyb/accounts/resync', '', '正在同步昵称与头像…'),
      }),
      node('button', { class: 'btn small ghost', text: '导入账号', onclick: () => acctFileInput.click() }),
      node('button', { class: 'btn small ghost', text: '导出全部', onclick: (e) => exportAccounts('', e.target) }),
      node('span', { class: 'grow' }),
      acctFilterSel.el,
      acctFileInput,
    ]),
    field(
      '脚本列',
      acctScriptsInput,
      '决定每个账号后面显示哪几个脚本的勾选框，格式 key=显示名，逗号分隔（如 mt=美团, sfsy=顺丰, ppcs=朴朴）。'
      + ' key 必须和脚本里自报的一致：脚本读环境变量 yyb_script_key，默认 sfsy_code.js 是 sfsy、ppcs_code.js 是 ppcs、meituan_code.js 是 mt。改完点右上角「保存配置」。',
    ),
    node('div', { class: 'row', style: 'margin-bottom:6px' }, [
      node('button', { class: 'btn small ghost', text: '保存脚本列', onclick: (e) => saveScriptColumns(e.target) }),
    ]),
    acctListEl,
    acctOut,
  ]);

  return node('section', { class: 'panel hidden', 'data-panel': 'accounts' }, [card]);
}

/** 保存「脚本列」定义（复用整体保存，成功后重画账号列表让勾选框跟着变） */
async function saveScriptColumns(btn) {
  if (btn) btn.disabled = true;
  const ok = await doSave(true);
  if (ok) {
    acctScriptsInput.value = scriptsToText(scriptDefs());
    show(acctOut, 'ok', ['✅ 已保存脚本列：' + (scriptDefs().map((s) => s.name + '（' + s.key + '）').join('、') || '（空）')]);
    await loadAccounts();
  } else {
    show(acctOut, 'err', ['保存失败，请检查网络或面板配置']);
  }
  if (btn) btn.disabled = false;
}

function statusPill(status) {
  const s = String(status || '').toLowerCase();
  const kind = s === 'alive' ? 'ok' : (s === 'expired' ? 'err' : 'warn');
  const text = s === 'alive' ? '存活' : (s === 'expired' ? '已失效' : (s === 'unknown' ? '待定' : (status || '待定')));
  return node('span', { class: 'pill ' + kind, text });
}

function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/** 勾选状态 → 要写进网关的标记串；全部勾上 = 空串（= 不限制，所有脚本都跑） */
function tagValue(checkedKeys, defs, extras) {
  const allOn = defs.every((d) => checkedKeys.includes(d.key));
  if (allOn && !extras.length) return '';
  const ordered = defs.filter((d) => checkedKeys.includes(d.key)).map((d) => d.key);
  return ordered.concat(extras).join(',');
}

function checkedKeys(box, defs) {
  return defs.filter((d) => {
    const cb = box.querySelector('input[data-script="' + d.key + '"]');
    return cb && cb.checked;
  }).map((d) => d.key);
}

/**
 * 每个账号下面那排「跑哪些脚本」勾选框。
 *
 * 语义：标记为空 = 不限制（所有脚本都跑，也就是默认行为）；
 * 一旦勾掉某个脚本，就把「剩下的那几个」写成白名单。全勾回去 = 又变回空串。
 */
function scriptToggles(a) {
  const defs = scriptDefs();
  if (!defs.length) return null;

  const tags = parseTags(a.scripts);
  const unrestricted = tags.length === 0;
  // 标记里有、但没写进「脚本列」的 key —— 保留它们，别在保存时悄悄抹掉
  const extras = tags.filter((k) => !defs.some((d) => d.key === k));

  const box = node('div', { style: 'display:flex;gap:14px;margin-top:7px;align-items:center;flex-wrap:wrap' });
  for (const def of defs) {
    const cb = node('input', {
      type: 'checkbox',
      'data-script': def.key,
      style: 'margin:0 5px 0 0;vertical-align:middle;cursor:pointer',
      onchange: () => saveScriptToggles(a, box, defs, extras),
    });
    cb.checked = unrestricted || tags.includes(def.key);
    box.appendChild(node('label', {
      style: 'display:inline-flex;align-items:center;font-size:13px;cursor:pointer;color:var(--muted)',
      title: '脚本标记：' + def.key,
    }, [cb, node('span', { text: def.name })]));
  }
  box.appendChild(node('span', {
    class: 'tag' + (unrestricted ? '' : ' primary'),
    title: '当前生效范围',
    text: unrestricted ? '全部脚本' : describeTags(tags.join(',')),
  }));
  return box;
}

async function saveScriptToggles(a, box, defs, extras) {
  const value = tagValue(checkedKeys(box, defs), defs, extras);
  const name = a.nickname || a.alias || a.openid || ('#' + a.ref);
  show(acctOut, 'info', ['正在保存…']);
  try {
    const r = await api('POST', '/api/yyb/accounts/scripts', { items: [{ ref: a.ref, scripts: value }] });
    if (r.accounts && r.accounts.length) renderAccounts(r.accounts);
    else await loadAccounts();
    show(acctOut, 'ok', [`✅「${name}」：${value ? describeTags(value) : '全部脚本（不限制）'}`]);
  } catch (e) {
    show(acctOut, 'err', ['保存失败：' + e.message]);
    await loadAccounts();   // 界面上的勾选回滚成服务端的真实状态
  }
}

function accountRow(a) {
  const name = a.nickname || a.alias || a.openid || ('#' + a.ref);
  const initial = (a.nickname || a.alias || a.openid || '#').slice(0, 1);
  const avatar = a.hasAvatar
    ? node('div', { class: 'acct-avatar' }, [
        node('img', { src: '/api/yyb/avatar?ref=' + encodeURIComponent(a.ref), alt: '' }),
      ])
    : node('div', { class: 'acct-avatar', text: initial.toUpperCase() });

  const btn = (text, fn, cls) => node('button', {
    class: 'btn small ' + (cls || 'ghost'), text,
    style: 'font-size:12px;padding:5px 10px', onclick: fn,
  });

  // 筛选视图下禁止拖拽（否则只保存可见账号的顺序，会把被筛掉的号顶到最后）
  const allView = !acctFilterSel || acctFilterSel.value === 'all';
  const handle = node('span', {
    text: '⠿',
    title: allView ? '拖动调整顺序' : '切回「全部状态」后可拖动排序',
    style: 'flex:0 0 auto;cursor:' + (allView ? 'grab' : 'not-allowed')
      + ';color:var(--muted);font-size:16px;line-height:46px;user-select:none;padding:0 2px'
      + (allView ? '' : ';opacity:.4'),
  });

  const card = node('div', {
    class: 'acct-card' + (String(a.status) === 'expired' ? ' expired' : ''),
    'data-ref': a.ref,
    draggable: allView ? 'true' : 'false',
    ondragstart: (e) => {
      if (!allView) return;
      dragRef = a.ref;
      card.style.opacity = '0.4';
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', a.ref); } catch (_) { /* IE */ }
      }
    },
    ondragend: () => {
      dragRef = null;
      card.style.opacity = '';
      clearDropHint();
    },
    ondragover: (e) => {
      if (!allView || !dragRef || dragRef === a.ref) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      clearDropHint();
      const rect = card.getBoundingClientRect();
      const after = e.clientY > rect.top + rect.height / 2;
      card.style.boxShadow = after ? 'inset 0 -2px 0 0 #2f6feb' : 'inset 0 2px 0 0 #2f6feb';
      card.dataset.dropAfter = after ? '1' : '0';
    },
    ondragleave: () => {
      card.style.boxShadow = '';
      delete card.dataset.dropAfter;
    },
    ondrop: async (e) => {
      e.preventDefault();
      const after = card.dataset.dropAfter === '1';
      card.style.boxShadow = '';
      delete card.dataset.dropAfter;
      if (!allView || !dragRef || dragRef === a.ref) return;
      reorderRow(dragRef, a.ref, after);
      dragRef = null;
      await saveAccountOrder();
    },
  }, [
    handle,
    avatar,
    node('div', { class: 'acct-body' }, [
      node('div', { class: 'acct-head' }, [
        node('span', { class: 'acct-name', text: name }),
        statusPill(a.status),
        a.uin ? node('span', { class: 'tag mono', text: 'uin ' + a.uin }) : null,
      ]),
      node('div', { class: 'acct-meta', text: 'openid ' + (a.openid || '-') }),
      node('div', { class: 'acct-times' }, [
        node('span', { html: '最后探测 <b>' + fmtTime(a.last_checked_at) + '</b>' }),
        node('span', { html: '入库 <b>' + fmtTime(a.created_at) + '</b>' }),
        node('span', { html: '最近刷新 <b>' + fmtTime(a.updated_at) + '</b>' }),
      ]),
      scriptToggles(a),
      node('div', { class: 'acct-actions' }, [
        btn('刷新登录态', (e) => doAccountAction(e.target, '/api/yyb/accounts/refresh', a.ref)),
        btn('同步资料', (e) => doAccountAction(e.target, '/api/yyb/accounts/resync', a.ref)),
        btn('导出', (e) => exportAccounts(a.ref, e.target)),
        btn('删除', (e) => removeAccount(e.target, a)),
      ]),
    ]),
  ]);

  return card;
}

/** 把拖动的行插到目标行的前面或后面 */
function reorderRow(srcRef, targetRef, after) {
  const rows = Array.from(acctListEl.querySelectorAll('[data-ref]'));
  const src = rows.find((el) => el.dataset.ref === srcRef);
  const tgt = rows.find((el) => el.dataset.ref === targetRef);
  if (!src || !tgt || src === tgt) return;
  tgt.parentNode.insertBefore(src, after ? tgt.nextSibling : tgt);
}

function clearDropHint() {
  acctListEl.querySelectorAll('[data-ref]').forEach((el) => {
    el.style.boxShadow = '';
    delete el.dataset.dropAfter;
  });
}

/** 拖完后把当前 DOM 顺序写回网关 */
async function saveAccountOrder() {
  const refs = Array.from(acctListEl.querySelectorAll('[data-ref]')).map((el) => el.dataset.ref);
  if (!refs.length) return;
  show(acctOut, 'info', ['正在保存账号顺序…']);
  try {
    const r = await api('POST', '/api/yyb/accounts/order', { refs });
    show(acctOut, 'ok', ['✅ 已保存账号顺序（共 ' + (r.ordered || refs.length) + ' 个）']);
    if (r.accounts) renderAccounts(r.accounts);
  } catch (e) {
    show(acctOut, 'err', ['保存顺序失败：' + e.message]);
  }
}

function renderAccounts(accounts) {
  acctData = accounts || [];

  // 统计瓦片（参考 YYB-Go-Enhanced 的 account console）
  if (acctStatsEl) {
    const counts = { alive: 0, expired: 0, unknown: 0 };
    for (const a of acctData) {
      const s = String(a.status || '').toLowerCase();
      if (s === 'alive') counts.alive++;
      else if (s === 'expired') counts.expired++;
      else counts.unknown++;
    }
    acctStatsEl.innerHTML = '';
    const tiles = [
      ['全部账号', acctData.length, ''],
      ['存活', counts.alive, 'ok'],
      ['已失效', counts.expired, 'err'],
      ['待定', counts.unknown, 'warn'],
    ];
    for (const [label, n, dot] of tiles) {
      acctStatsEl.appendChild(node('div', { class: 'acct-stat' }, [
        node('strong', { text: String(n) }),
        node('span', { html: (dot ? '<span class="dot ' + dot + '" style="display:inline-block;vertical-align:1px;margin-right:6px"></span>' : '') + label }),
      ]));
    }
  }

  acctListEl.innerHTML = '';
  if (!acctData.length) {
    acctListEl.appendChild(node('div', { class: 'note info', text: '还没有账号。去扫码页用「应用宝扫码」扫一次就会出现在这里。' }));
    return;
  }

  const filter = acctFilterSel ? acctFilterSel.value : 'all';
  const items = acctData.filter((a) => filter === 'all' || String(a.status || '').toLowerCase() === filter);
  if (!items.length) {
    acctListEl.appendChild(node('div', { class: 'note info', text: '当前筛选下没有账号。' }));
    return;
  }
  for (const a of items) acctListEl.appendChild(accountRow(a));
}

async function loadKeepAlive() {
  if (!keepAliveEl) return;
  try {
    const d = await api('GET', '/api/yyb/keepalive');
    keepAliveEl.innerHTML = '';
    if (!d.enabled) {
      keepAliveEl.appendChild(node('div', { class: 'note warn', style: 'margin-bottom:14px', text: '保活未启用（YYB_KEEPALIVE_INTERVAL 未配置）。登录态只有 2 小时有效，建议开启：后台定时刷一轮存活账号，防闲置失效。' }));
      return;
    }
    const c = d.counts || {};
    const meta = '每 ' + (d.interval || '—') + ' 刷一轮'
      + (d.last_start_at ? ' · 上次 ' + fmtTime(d.last_start_at) : '')
      + (d.next_run_at ? ' · 下轮 ' + fmtTime(d.next_run_at) : '');
    const counts = d.counts
      ? node('div', { style: 'display:flex;gap:6px;flex-wrap:wrap;margin-top:7px' }, [
          node('span', { class: 'tag ok', text: '存活 ' + (c.alive || 0) }),
          node('span', { class: 'tag err', text: '失效 ' + (c.expired || 0) }),
          node('span', { class: 'tag warn', text: '待定 ' + (c.unknown || 0) }),
          node('span', { class: 'tag', text: '跳过 ' + (c.skipped || 0) }),
        ])
      : null;
    keepAliveEl.appendChild(node('div', { class: 'stat', style: 'margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap' }, [
      node('div', { style: 'flex:1;min-width:200px' }, [
        node('div', { class: 'stat-label', text: '账号保活' + (d.running ? '（刷新中…）' : '') }),
        node('div', { style: 'font-size:12.5px;color:var(--muted);margin-top:5px' }, [node('span', { text: meta })]),
        counts,
      ]),
      node('button', { class: 'btn small ghost', text: '立即保活一轮', onclick: (e) => runKeepAlive(e.target) }),
    ]));
  } catch (e) {
    keepAliveEl.innerHTML = '';
    keepAliveEl.appendChild(node('div', { class: 'note err', style: 'margin-bottom:14px', text: '读取保活状态失败：' + e.message }));
  }
}

async function runKeepAlive(btn) {
  btn.disabled = true;
  show(acctOut, 'info', ['已触发一轮保活，正在后台刷新存活账号…']);
  try {
    await api('POST', '/api/yyb/keepalive');
    await new Promise((r) => setTimeout(r, 2500));
    await loadKeepAlive();
    await loadAccounts();
  } catch (e) {
    show(acctOut, 'err', ['保活失败：' + e.message]);
  }
  btn.disabled = false;
}

async function loadAccounts(btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await api('GET', '/api/yyb/accounts');
    renderAccounts(r.accounts);
    acctOut.innerHTML = '';
    loadKeepAlive();
  } catch (e) {
    acctListEl.innerHTML = '';
    show(acctOut, 'err', [e.message]);
  }
  if (btn) btn.disabled = false;
}

async function doAccountAction(btn, url, ref, busyText) {
  btn.disabled = true;
  show(acctOut, 'info', [busyText || '正在处理…']);
  try {
    const r = await api('POST', url, { ref: ref || '' });
    show(acctOut, 'ok', ['已完成']);
    if (r.accounts) renderAccounts(r.accounts);
  } catch (e) {
    show(acctOut, 'err', [e.message]);
  }
  btn.disabled = false;
}

/* 导出账号：ref 为空导出全部。接口返回 JSON 文件（attachment），用 blob 触发浏览器下载 */
async function exportAccounts(ref, btn) {
  if (btn) btn.disabled = true;
  show(acctOut, 'info', [ref ? '正在导出该账号…' : '正在导出全部账号…']);
  try {
    const qs = ref ? '?ref=' + encodeURIComponent(ref) : '';
    const res = await fetch('/api/yyb/accounts/export' + qs, { credentials: 'same-origin' });
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const j = await res.json(); msg = j.error || msg; } catch (_) {}
      throw new Error(msg);
    }
    const blob = await res.blob();
    const dispo = res.headers.get('Content-Disposition') || '';
    const m = dispo.match(/filename="?([^";]+)"?/);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = m ? m[1] : 'yyb-accounts.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    show(acctOut, 'ok', [ref ? '已导出该账号（见浏览器下载）' : '已导出全部账号（见浏览器下载）']);
  } catch (e) {
    show(acctOut, 'err', ['导出失败：' + e.message]);
  }
  if (btn) btn.disabled = false;
}

/* 导入账号：文件格式为账号数组（或 {"accounts":[...]}），与导出的文件一致 */
async function importAccounts(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  show(acctOut, 'info', ['正在导入 ' + file.name + ' …']);
  try {
    const text = await file.text();
    let payload;
    try {
      payload = JSON.parse(text);
    } catch (_) {
      throw new Error('文件不是合法 JSON');
    }
    const accounts = Array.isArray(payload) ? payload : (payload && payload.accounts);
    if (!Array.isArray(accounts) || !accounts.length) {
      throw new Error('文件里没有账号数组');
    }
    const r = await api('POST', '/api/yyb/accounts/import', { accounts });
    const lines = ['✅ 导入完成：新建 ' + (r.created || 0) + ' 个，更新 ' + (r.updated || 0) + ' 个'];
    if (r.skipped && r.skipped.length) {
      lines.push('⚠️ 跳过 ' + r.skipped.length + ' 个：' + r.skipped.slice(0, 3).map((s) => {
        const who = s.openid ? s.openid.slice(0, 12) + '…' : '未知';
        return who + '（' + (s.reason || '原因未知') + '）';
      }).join('；'));
    }
    show(acctOut, 'ok', lines);
    if (r.accounts) renderAccounts(r.accounts);
  } catch (e) {
    show(acctOut, 'err', ['导入失败：' + e.message]);
  } finally {
    input.value = '';   // 允许重复选同一个文件
  }
}

async function removeAccount(btn, a) {
  const name = a.nickname || a.alias || a.openid || ('#' + a.ref);
  if (!confirm('确定删除账号「' + name + '」？删除后青龙脚本将不再使用它，需要重新扫码才能恢复。')) return;
  btn.disabled = true;
  show(acctOut, 'info', ['正在删除…']);
  try {
    await api('DELETE', '/api/yyb/accounts?ref=' + encodeURIComponent(a.ref));
    // 先刷新列表（loadAccounts 成功时会清空 acctOut），再显示结果，
    // 否则「已删除」会被随后的刷新清掉，看起来像没生效
    await loadAccounts();
    show(acctOut, 'ok', ['已删除：' + name]);
  } catch (e) {
    show(acctOut, 'err', [e.message]);
  }
  btn.disabled = false;
}

/* ---------- 引导 ---------- */

async function boot() {
  let h;
  try {
    h = await api('GET', '/api/admin/health');
  } catch (e) {
    document.body.classList.remove('admin');
    app.innerHTML = '';
    app.appendChild(node('div', { class: 'wrap' }, [noteBox('err', ['无法连接面板服务：' + e.message])]));
    return;
  }
  if (h.needsSetup) return renderAuth('setup');
  if (!h.loggedIn) return renderAuth('login');

  try {
    cfg = await api('GET', '/api/admin/config');
  } catch (e) {
    return renderAuth('login');
  }
  renderShell();
}

// 手动改 hash（或浏览器前进后退）时同步切换面板
window.addEventListener('hashchange', () => {
  if (document.querySelector('.admin-shell')) activateFromHash();
});

boot();
</script>
