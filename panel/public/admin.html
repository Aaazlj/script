<body>

<script>
const $ = (id) => document.getElementById(id);
const app = $('app');

const ICONS = {

  plug: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v6M15 3v6"/><path d="M6 9h12v2a6 6 0 0 1-6 6 6 6 0 0 1-6-6V9Z"/><path d="M12 17v4"/></svg>',
  box: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 12 4l9 4.5-9 4.5-9-4.5Z"/><path d="M3 8.5v7L12 20l9-4.5v-7"/></svg>',
  bag: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',

  users: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 6.2a3 3 0 0 1 0 5.6"/><path d="M17.5 20a5.5 5.5 0 0 0-2.2-4.4"/></svg>',
};

const PANELS = [
  { id: 'overview', name: '概览', sub: '各通道状态一览', icon: ICONS.grid, save: false },
  { id: 'accounts', name: '应用宝账号', sub: '管理已扫码入库的微信账号', icon: ICONS.users, save: false },
  { id: 'qinglong', name: '青龙面板', sub: 'OpenAPI 凭据配置', icon: ICONS.plug, save: true },
  { id: 'yyb', name: '应用宝网关', sub: 'yyb_go 地址与写入值', icon: ICONS.box, save: true },
  { id: 'sign', name: '美团签名服务', sub: '给脚本提供 mtgsig 签名', icon: ICONS.bag, save: false },
  { id: 'security', name: '账号安全', sub: '修改管理员密码', icon: ICONS.shield, save: false },
];

let cfg = null;
let current = 'overview';

async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok || !data || data.ok !== true) {
    const err = new Error((data && data.error) || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return data.data;
}

/* ---------- DOM 小工具 ---------- */

function node(tag, props, children) {
  const n = document.createElement(tag);
  if (props) for (const k of Object.keys(props)) {
    const v = props[k];
    if (v === undefined || v === null) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'style') n.setAttribute('style', v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of (children || [])) if (c) n.appendChild(c);
  return n;
}

function noteBox(kind, lines) {
  const box = node('div', { class: 'note ' + kind, style: 'margin-top:14px' });
  for (const line of (lines || [])) {
    // 允许调用方用 `cond ? '文案' : null` 这种写法，空值直接跳过，
    // 否则 appendChild(null) 会抛 "parameter 1 is not of type 'Node'"
    if (line === null || line === undefined || line === false || line === '') continue;
    box.appendChild(typeof line === 'string' || typeof line === 'number'
      ? node('div', { text: String(line) })
      : line);
  }
  return box;
}

function show(out, kind, lines) {
  out.innerHTML = '';
  out.appendChild(noteBox(kind, lines));
}

function field(label, inputEl, desc) {
  return node('div', { class: 'field' }, [
    node('label', { text: label }),
    inputEl,
    desc ? node('div', { class: 'desc', text: desc }) : null,
  ]);
}

function input(id, opts) {
  const o = opts || {};
  const attrs = Object.assign({ type: 'text', id: id, autocomplete: 'off' }, o.attrs || {});
  const i = node('input', attrs);
  if (o.value) i.value = o.value;
  return i;
}

function stat(label, value, dotKind) {
  return node('div', { class: 'stat' }, [
    node('div', { class: 'stat-label' }, [
      dotKind ? node('span', { class: 'dot ' + dotKind }) : null,
      node('span', { text: label }),
    ]),
    node('div', { class: 'stat-value', text: value }),
  ]);
}

function testButton(text, run) {
  const out = node('div');
  const btn = node('button', {
    class: 'btn ghost small', text: text,
    onclick: async () => {
      btn.disabled = true;
      show(out, 'info', ['正在检测…']);
      try {
        const lines = await run();
        show(out, 'ok', lines.filter(Boolean));
      } catch (e) {
        show(out, 'err', [e.message]);
      }
      btn.disabled = false;
    },
  });
  return node('div', {}, [node('div', { class: 'row' }, [btn]), out]);
}

/* ---------- 登录 / 初始化 ---------- */

function renderAuth(kind) {
  document.body.classList.remove('admin');
  app.innerHTML = '';
  const isSetup = kind === 'setup';
  const pw = input('pw', { attrs: { type: 'password' } });
  const pw2 = input('pw2', { attrs: { type: 'password' } });
  const out = node('div');

  const submit = async (ev) => {
    ev.target.disabled = true;
    try {
      if (isSetup) await api('POST', '/api/admin/setup', { password: pw.value, confirm: pw2.value });
      else await api('POST', '/api/admin/login', { password: pw.value });
      await boot();
    } catch (e) {
      show(out, 'err', [e.message]);
      ev.target.disabled = false;
    }
  };

  const card = node('div', { class: 'card' }, [
    node('h2', { text: isSetup ? '首次使用：设置管理员密码' : '管理员登录' }),
    node('div', { class: 'hint', text: isSetup ? '这个密码用来保护下面的青龙凭据配置，请妥善保存。' : '输入初始化时设置的管理员密码。' }),
    field('管理员密码', pw, isSetup ? '至少 8 位' : null),
    isSetup ? field('确认密码', pw2) : null,
    node('div', { class: 'row' }, [
      node('button', { class: 'btn', text: isSetup ? '设置并进入后台' : '登录', onclick: submit }),
    ]),
    out,
  ]);

  pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') card.querySelector('button.btn').click(); });

  app.appendChild(node('div', { class: 'wrap' }, [
    node('h1', { class: 'page-title', text: '管理后台' }),
    node('p', { class: 'page-sub', text: '配置青龙面板凭据与两个扫码通道，普通用户扫码后即可自动写入。' }),
    card,
    node('div', { class: 'footer' }, [node('a', { href: '/', text: '← 返回扫码页' })]),
  ]));
  pw.focus();
}

/* ---------- 后台三个壳 ---------- */

function renderShell() {
  document.body.classList.add('admin');
  app.innerHTML = '';

  const navItems = PANELS.map((p) => node('button', {
    class: 'nav-item' + (p.id === current ? ' active' : ''),
    'data-panel': p.id,
    html: '<span class="ico">' + p.icon + '</span><span>' + p.name + '</span>',
    onclick: () => activate(p.id),
  }));

  const nav = node('aside', { class: 'admin-nav' }, [
    node('div', { class: 'brand' }, [
      node('span', { text: '扫码登录面板' }),
      node('span', { text: '应用宝 · 美团 → 青龙' }),
    ]),
    node('nav', { class: 'nav-list' }, navItems),
    node('div', { class: 'nav-foot' }, [
      node('a', { class: 'nav-item', href: '/', html: '<span class="ico">↗</span><span>打开扫码页</span>' }),
    ]),
  ]);

  const saveBtn = node('button', { class: 'btn small', text: '保存配置', onclick: doSave });
  const head = node('header', { class: 'admin-head' }, [
    node('div', {}, [
      node('h1', { id: 'panelTitle', text: '' }),
      node('div', { class: 'sub', id: 'panelSub', text: '' }),
    ]),
    node('div', { class: 'head-actions' }, [saveBtn]),
  ]);

  const main = node('main', { class: 'admin-main' }, [head, node('div', { id: 'panels' })]);
  app.appendChild(node('div', { class: 'admin-shell' }, [nav, main]));

  const body = $('panels');
  body.appendChild(buildOverview());
  body.appendChild(buildAccounts());
  body.appendChild(buildQinglong());
  body.appendChild(buildYyb());
  body.appendChild(buildSign());
  body.appendChild(buildSecurity());

  activateFromHash();
}

function activate(id, push) {
  const meta = PANELS.find((p) => p.id === id) || PANELS[0];
  id = meta.id;
  current = id;
  for (const b of document.querySelectorAll('.nav-item[data-panel]')) {
    b.classList.toggle('active', b.dataset.panel === id);
  }
  for (const p of document.querySelectorAll('.panel')) {
    p.classList.toggle('hidden', p.dataset.panel !== id);
  }
  $('panelTitle').textContent = meta.name;
  $('panelSub').textContent = meta.sub;
  const actions = document.querySelector('.head-actions');
  actions.style.display = meta.save ? '' : 'none';
  // 用 hash 记录当前位置，刷新后仍停在同一个面板
  if (push !== false) history.replaceState({ panel: id }, '', '#' + id);
  if (id === 'overview') refreshOverview();
  if (id === 'accounts') loadAccounts();
}

function activateFromHash() {
  const hash = location.hash.replace('#', '');
  activate(PANELS.some((p) => p.id === hash) ? hash : 'overview', false);
}

/* ---------- 概览 ---------- */

let overviewGrid = null;

function buildOverview() {
  const grid = node('div', { class: 'stat-grid' });
  overviewGrid = grid;

  const hint = node('div', { class: 'card' }, [
    node('h2', { text: '从这里开始' }),
    node('div', { class: 'hint', text: '按顺序配置下面两项，然后打开扫码页让用户扫码即可。配置项会写入本机 data/config.json（0600）。' }),
    node('div', { class: 'row' }, [
      node('button', { class: 'btn small ghost', text: '去配置青龙面板', onclick: () => activate('qinglong') }),
      node('button', { class: 'btn small ghost', text: '去配置应用宝网关', onclick: () => activate('yyb') }),
    ]),
  ]);

  return node('section', { class: 'panel', 'data-panel': 'overview' }, [grid, hint]);
}

function refreshOverview() {
  if (!overviewGrid) return;
  overviewGrid.innerHTML = '';
  overviewGrid.appendChild(stat('青龙面板', cfg.qinglong.host || '未配置', cfg.qinglong.host && cfg.qinglong.clientSecretSet ? 'ok' : 'err'));
  overviewGrid.appendChild(stat('Client ID', cfg.qinglong.clientId || '未配置', cfg.qinglong.clientId ? 'ok' : 'err'));
  overviewGrid.appendChild(stat('Client Secret', cfg.qinglong.clientSecretSet ? '已保存' : '未配置', cfg.qinglong.clientSecretSet ? 'ok' : 'err'));
  overviewGrid.appendChild(stat('应用宝网关', cfg.yyb.baseUrl || '未配置', cfg.yyb.baseUrl ? 'ok' : 'err'));
  overviewGrid.appendChild(stat('写入青龙的地址', cfg.yyb.publicBaseUrl || '（跟随网关地址）', cfg.yyb.publicBaseUrl ? 'ok' : 'warn'));

  // 美团签名服务是异步探测的，先占位再回填
  const signStat = stat('美团签名服务', '检查中…', 'warn');
  overviewGrid.appendChild(signStat);
  api('GET', '/api/meituan/sign/health').then((r) => {
    const val = signStat.querySelector('.stat-value');
    const dot = signStat.querySelector('.dot');
    if (val) val.textContent = r.available ? '可用' : '不可用';
    if (dot) dot.className = 'dot ' + (r.available ? 'ok' : 'err');
  }).catch(() => {
    const val = signStat.querySelector('.stat-value');
    const dot = signStat.querySelector('.dot');
    if (val) val.textContent = '不可用';
    if (dot) dot.className = 'dot err';
  });
}

/* ---------- 青龙面板 ---------- */

let qlHost, qlId, qlSecret, qlOut;

function buildQinglong() {
  qlHost = input('qlHost', { value: cfg.qinglong.host, attrs: { placeholder: 'http://qinglong-web-1:5700' } });
  qlId = input('qlId', { value: cfg.qinglong.clientId, attrs: { placeholder: '青龙后台新建应用后得到的 Client ID' } });
  qlSecret = input('qlSecret', { attrs: { type: 'password', placeholder: cfg.qinglong.clientSecretSet ? '已保存，留空表示不修改' : '请输入 Client Secret' } });
  qlOut = node('div');

  const clearBtn = cfg.qinglong.clientSecretSet ? node('button', {
    class: 'btn ghost small', text: '清除已保存的 Secret',
    onclick: async () => { await api('POST', '/api/admin/config/clear-secret'); await boot(); activate('qinglong'); },
  }) : null;

  return node('section', { class: 'panel hidden', 'data-panel': 'qinglong' }, [
    node('div', { class: 'card' }, [
      node('h2', { text: '青龙面板 OpenAPI' }),
      node('div', { class: 'hint', text: '青龙后台：系统设置 → 应用设置 → 新建应用，拿到 Client ID 与 Client Secret。' }),
      field('面板地址 host', qlHost, '可以写 http://ip:5700，也可以只写 ip:5700；容器里默认走 compose 内网服务名'),
      field('Client ID', qlId),
      field('Client Secret', qlSecret, cfg.qinglong.clientSecretSet ? '已配置，留空则不修改' : '保存后不会再回传到前端，只显示「已保存」'),
      node('div', { class: 'row' }, [
        node('button', {
          class: 'btn ghost small', text: '测试连接',
          onclick: async (ev) => {
            ev.target.disabled = true;
            show(qlOut, 'info', ['正在连接…']);
            if (await doSave(true)) {
              try {
                const r = await api('POST', '/api/admin/test/qinglong');
                show(qlOut, 'ok', [
                  '连接成功：' + r.host,
                  '鉴权接口：' + r.endpoint + (r.flavor === 'open' ? '（新版 /open 前缀）' : '（老版 /api 前缀）'),
                  '面板版本：' + (r.version || '未知') + (r.branch ? '（' + r.branch + '）' : ''),
                  '已有环境变量：' + (r.envCount >= 0 ? r.envCount + ' 条' : '读取失败'),
                  r.envError ? '环境变量读取告警：' + r.envError : null,
                  r.yyb_server && r.yyb_server.ok
                    ? (r.yyb_server.skipped
                        ? 'yyb_server 已存在，保持青龙里的配置不动'
                        : '已兜底新建 yyb_server = ' + r.yyb_server.value)
                    : (r.yyb_server && r.yyb_server.error ? 'yyb_server 兜底失败：' + r.yyb_server.error : null),
                ]);
              } catch (e) { show(qlOut, 'err', [e.message]); }
            }
            ev.target.disabled = false;
          },
        }),
        clearBtn,
      ]),
      qlOut,
    ]),
  ]);
}

/* ---------- 应用宝网关 ---------- */

let yybBase, yybPub, yybOut;

function buildYyb() {
  yybBase = input('yybBase', { value: cfg.yyb.baseUrl, attrs: { placeholder: 'http://yyb-go:8000' } });
  yybPub = input('yybPub', { value: cfg.yyb.publicBaseUrl, attrs: { placeholder: '留空则自动推断' } });
  yybOut = node('div');

  return node('section', { class: 'panel hidden', 'data-panel': 'yyb' }, [
    node('div', { class: 'card' }, [
      node('h2', { text: '应用宝网关（yyb_go）' }),
      node('div', { class: 'hint', text: '扫码时机密由面板服务端去网关取二维码；扫码成功后把网关地址写进青龙的 yyb_server。' }),
      field('网关地址', yybBase, '面板所在容器能访问到的 yyb_go 地址'),
      field('写入青龙的地址', yybPub, '写进 yyb_server 的值；留空则用网关地址（本机回环时自动替换成面板访问地址）'),
      testButton('测试连通', async () => {
        if (!(await doSave(true))) throw new Error('请先修正配置后再测试');
        const r = await api('POST', '/api/admin/test/yyb');
        return ['网关可用：' + r.url, 'HTTP ' + r.status];
      }),
      yybOut,
    ]),
  ]);
}

/* ---------- 美团签名服务 ---------- */

function buildSign() {
  const out = node('div');

  const wrapper = node('div', { class: 'card' }, [
    node('h2', { text: '美团签名服务（mtgsig）' }),
    node('div', { class: 'hint', text: 'media.meituan.com 的福利社接口强制校验 mtgsig 签名头，没有签名一律 403。签名算法在美团自家的混淆 JS（cliguard）里，本面板把它加载进来，对外暴露 POST /api/meituan/sign 供青龙里的 meituan_code.js 借用。' }),
    node('div', { class: 'hint', text: '青龙里的脚本默认把 mt_sign_url 指向 http://panel:5180/api/meituan/sign；面板与青龙在同一个 compose 网络里时开箱即用。' }),
    testButton('检查签名服务', async () => {
      const r = await api('GET', '/api/meituan/sign/health');
      return r.available
        ? ['cliguard 已加载，签名服务可用', '接口：POST /api/meituan/sign']
        : ['cliguard 未加载：面板容器里没找到 vendor/cliguard/js/cliguard.js',
           '请确认已把美团专家包挂到容器内的 /opt/meituan-expert，或用 MEITUAN_CLIGUARD_JS 指定路径。'];
    }),
    out,
  ]);

  return node('section', { class: 'panel hidden', 'data-panel': 'sign' }, [wrapper]);
}

/* ---------- 账号安全 ---------- */

function buildSecurity() {
  const oldPw = input('oldPw', { attrs: { type: 'password' } });
  const newPw = input('newPw', { attrs: { type: 'password' } });
  const newPw2 = input('newPw2', { attrs: { type: 'password' } });
  const out = node('div');

  return node('section', { class: 'panel hidden', 'data-panel': 'security' }, [
    node('div', { class: 'card' }, [
      node('h2', { text: '修改管理员密码' }),
      node('div', { class: 'hint', text: '修改后当前会话会自动续期，其他已登录的浏览器需要重新登录。' }),
      field('原密码', oldPw),
      field('新密码', newPw, '至少 8 位'),
      field('确认新密码', newPw2),
      node('div', { class: 'row' }, [
        node('button', {
          class: 'btn', text: '修改密码',
          onclick: async (ev) => {
            ev.target.disabled = true;
            try {
              await api('POST', '/api/admin/password', {
                oldPassword: oldPw.value, newPassword: newPw.value, confirm: newPw2.value,
              });
              show(out, 'ok', ['密码已更新']);
              oldPw.value = newPw.value = newPw2.value = '';
            } catch (e) { show(out, 'err', [e.message]); }
            ev.target.disabled = false;
          },
        }),
        node('button', {
          class: 'btn ghost small', text: '退出登录',
          onclick: async () => { await api('POST', '/api/admin/logout'); await boot(); },
        }),
      ]),
      out,
    ]),
    node('div', { class: 'card' }, [
      node('h2', { text: '安全说明' }),
      node('div', { class: 'hint', text: '密码用 scrypt 加盐哈希存储；会话是 HMAC 签名的过期时间戳，放在 HttpOnly Cookie 里；登录失败按 IP 限速。' }),
      node('div', { class: 'hint', text: 'Client Secret 与扫到的 token 永不回传前端，只回传脱敏值。', style: 'margin-bottom:0' }),
    ]),
  ]);
}

/* ---------- 保存 ---------- */

async function doSave(silent) {
  try {
    await api('PUT', '/api/admin/config', {
      qinglong: { host: qlHost.value, clientId: qlId.value, clientSecret: qlSecret.value },
      yyb: { baseUrl: yybBase.value, publicBaseUrl: yybPub.value },
    });
    qlSecret.value = '';
    cfg = await api('GET', '/api/admin/config');
    if (!silent) {
      const actions = document.querySelector('.head-actions');
      const tip = node('span', { text: '✓ 已保存', style: 'color:var(--ok);font-size:13px;margin-right:8px' });
      actions.insertBefore(tip, actions.firstChild);
      setTimeout(() => tip.remove(), 2000);
    }
    return true;
  } catch (e) {
    if (!silent) alert('保存失败：' + e.message);
    return false;
  }
}

/* ---------- 应用宝账号 ---------- */

let acctListEl, acctOut, acctFileInput;
let dragRef = null;

function buildAccounts() {
  acctOut = node('div');
  acctListEl = node('div');
  acctFileInput = node('input', {
    type: 'file',
    accept: '.json,application/json',
    style: 'display:none',
    onchange: (e) => importAccounts(e.target),
  });

  const card = node('div', { class: 'card' }, [
    node('h2', { text: '已入库的应用宝账号' }),
    node('div', { class: 'hint', text: '这里显示扫码登录后存进 yyb_go 网关的微信账号。青龙脚本通过 yyb_server 调它取 code，删掉某个账号即可让脚本不再用它。拖动左侧手柄可以调整顺序（脚本按这个顺序依次执行）。' }),
    node('div', { class: 'row', style: 'margin-bottom:14px' }, [
      node('button', { class: 'btn small ghost', text: '刷新列表', onclick: (e) => loadAccounts(e.target) }),
      node('button', {
        class: 'btn small ghost', text: '刷新全部登录态',
        onclick: (e) => doAccountAction(e.target, '/api/yyb/accounts/refresh', '', '正在逐个探测登录态，多账号会比较慢…'),
      }),
      node('button', {
        class: 'btn small ghost', text: '同步全部资料',
        onclick: (e) => doAccountAction(e.target, '/api/yyb/accounts/resync', '', '正在同步昵称与头像…'),
      }),
      node('button', { class: 'btn small ghost', text: '导入账号', onclick: () => acctFileInput.click() }),
      node('button', { class: 'btn small ghost', text: '导出全部', onclick: (e) => exportAccounts('', e.target) }),
      acctFileInput,
    ]),
    acctListEl,
    acctOut,
  ]);

  return node('section', { class: 'panel hidden', 'data-panel': 'accounts' }, [card]);
}

function statusBadge(status) {
  const s = String(status || '').toLowerCase();
  const kind = s === 'alive' ? 'ok' : (s === 'expired' ? 'err' : (s === 'unknown' ? 'warn' : 'warn'));
  const text = s === 'alive' ? '正常' : (s === 'expired' ? '已失效' : (s === 'unknown' ? '未知' : (status || '未知')));
  return node('span', { class: 'stat-label', style: 'gap:5px' }, [
    node('span', { class: 'dot ' + kind }),
    node('span', { text: text }),
  ]);
}

function accountRow(a) {
  const name = a.nickname || a.alias || a.openid || ('#' + a.ref);
  const avatar = a.hasAvatar
    ? node('img', { src: '/api/yyb/avatar?ref=' + encodeURIComponent(a.ref), alt: '', style: 'width:38px;height:38px;border-radius:50%;object-fit:cover;background:#f1efea;flex:0 0 38px' })
    : node('div', { style: 'width:38px;height:38px;border-radius:50%;background:#eef0f4;flex:0 0 38px' });

  const meta = node('div', { style: 'flex:1;min-width:0' }, [
    node('div', { text: name, style: 'font-weight:500' }),
    node('div', { text: 'openid ' + (a.openid || '-') + (a.uin ? ' · uin ' + a.uin : ''), style: 'font-size:12px;color:var(--muted);word-break:break-all' }),
  ]);

  const btn = (text, fn, cls) => node('button', {
    class: 'btn small ' + (cls || 'ghost'), text,
    style: 'font-size:12px;padding:5px 10px', onclick: fn,
  });

  const ops = node('div', { class: 'row', style: 'flex:0 0 auto;gap:6px' }, [
    btn('刷新登录态', (e) => doAccountAction(e.target, '/api/yyb/accounts/refresh', a.ref)),
    btn('同步资料', (e) => doAccountAction(e.target, '/api/yyb/accounts/resync', a.ref)),
    btn('导出', (e) => exportAccounts(a.ref, e.target)),
    btn('删除', (e) => removeAccount(e.target, a), ''),
  ]);

  const handle = node('span', {
    text: '⠿',
    title: '拖动调整顺序',
    style: 'flex:0 0 auto;cursor:grab;color:var(--muted);font-size:16px;line-height:1;user-select:none;padding:0 2px',
  });

  const row = node('div', {
    'data-ref': a.ref,
    draggable: 'true',
    style: 'display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)',
    ondragstart: (e) => {
      dragRef = a.ref;
      row.style.opacity = '0.4';
      if (e.dataTransfer) {
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', a.ref); } catch (_) { /* IE */ }
      }
    },
    ondragend: () => {
      dragRef = null;
      row.style.opacity = '';
      clearDropHint();
    },
    ondragover: (e) => {
      if (!dragRef || dragRef === a.ref) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      clearDropHint();
      const rect = row.getBoundingClientRect();
      const after = e.clientY > rect.top + rect.height / 2;
      row.style.boxShadow = after ? 'inset 0 -2px 0 0 #2f6feb' : 'inset 0 2px 0 0 #2f6feb';
      row.dataset.dropAfter = after ? '1' : '0';
    },
    ondragleave: () => {
      row.style.boxShadow = '';
      delete row.dataset.dropAfter;
    },
    ondrop: async (e) => {
      e.preventDefault();
      const after = row.dataset.dropAfter === '1';
      row.style.boxShadow = '';
      delete row.dataset.dropAfter;
      if (!dragRef || dragRef === a.ref) return;
      reorderRow(dragRef, a.ref, after);
      dragRef = null;
      await saveAccountOrder();
    },
  }, [handle, avatar, meta, statusBadge(a.status), ops]);

  return row;
}

/** 把拖动的行插到目标行的前面或后面 */
function reorderRow(srcRef, targetRef, after) {
  const rows = Array.from(acctListEl.querySelectorAll('[data-ref]'));
  const src = rows.find((el) => el.dataset.ref === srcRef);
  const tgt = rows.find((el) => el.dataset.ref === targetRef);
  if (!src || !tgt || src === tgt) return;
  tgt.parentNode.insertBefore(src, after ? tgt.nextSibling : tgt);
}

function clearDropHint() {
  acctListEl.querySelectorAll('[data-ref]').forEach((el) => {
    el.style.boxShadow = '';
    delete el.dataset.dropAfter;
  });
}

/** 拖完后把当前 DOM 顺序写回网关 */
async function saveAccountOrder() {
  const refs = Array.from(acctListEl.querySelectorAll('[data-ref]')).map((el) => el.dataset.ref);
  if (!refs.length) return;
  show(acctOut, 'info', ['正在保存账号顺序…']);
  try {
    const r = await api('POST', '/api/yyb/accounts/order', { refs });
    show(acctOut, 'ok', ['✅ 已保存账号顺序（共 ' + (r.ordered || refs.length) + ' 个）']);
    if (r.accounts) renderAccounts(r.accounts);
  } catch (e) {
    show(acctOut, 'err', ['保存顺序失败：' + e.message]);
  }
}

function renderAccounts(accounts) {
  acctListEl.innerHTML = '';
  if (!accounts || !accounts.length) {
    acctListEl.appendChild(node('div', { class: 'note info', text: '还没有账号。去扫码页用「应用宝扫码」扫一次就会出现在这里。' }));
    return;
  }
  acctListEl.appendChild(node('div', { class: 'stat-label', style: 'margin-bottom:4px' }, [
    node('span', { text: '共 ' + accounts.length + ' 个账号（拖动 ⠿ 可调整顺序）' }),
  ]));
  for (const a of accounts) acctListEl.appendChild(accountRow(a));
}

async function loadAccounts(btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await api('GET', '/api/yyb/accounts');
    renderAccounts(r.accounts);
    acctOut.innerHTML = '';
  } catch (e) {
    acctListEl.innerHTML = '';
    show(acctOut, 'err', [e.message]);
  }
  if (btn) btn.disabled = false;
}

async function doAccountAction(btn, url, ref, busyText) {
  btn.disabled = true;
  show(acctOut, 'info', [busyText || '正在处理…']);
  try {
    const r = await api('POST', url, { ref: ref || '' });
    show(acctOut, 'ok', ['已完成']);
    if (r.accounts) renderAccounts(r.accounts);
  } catch (e) {
    show(acctOut, 'err', [e.message]);
  }
  btn.disabled = false;
}

/* 导出账号：ref 为空导出全部。接口返回 JSON 文件（attachment），用 blob 触发浏览器下载 */
async function exportAccounts(ref, btn) {
  if (btn) btn.disabled = true;
  show(acctOut, 'info', [ref ? '正在导出该账号…' : '正在导出全部账号…']);
  try {
    const qs = ref ? '?ref=' + encodeURIComponent(ref) : '';
    const res = await fetch('/api/yyb/accounts/export' + qs, { credentials: 'same-origin' });
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { const j = await res.json(); msg = j.error || msg; } catch (_) {}
      throw new Error(msg);
    }
    const blob = await res.blob();
    const dispo = res.headers.get('Content-Disposition') || '';
    const m = dispo.match(/filename="?([^";]+)"?/);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = m ? m[1] : 'yyb-accounts.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    show(acctOut, 'ok', [ref ? '已导出该账号（见浏览器下载）' : '已导出全部账号（见浏览器下载）']);
  } catch (e) {
    show(acctOut, 'err', ['导出失败：' + e.message]);
  }
  if (btn) btn.disabled = false;
}

/* 导入账号：文件格式为账号数组（或 {"accounts":[...]}），与导出的文件一致 */
async function importAccounts(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  show(acctOut, 'info', ['正在导入 ' + file.name + ' …']);
  try {
    const text = await file.text();
    let payload;
    try {
      payload = JSON.parse(text);
    } catch (_) {
      throw new Error('文件不是合法 JSON');
    }
    const accounts = Array.isArray(payload) ? payload : (payload && payload.accounts);
    if (!Array.isArray(accounts) || !accounts.length) {
      throw new Error('文件里没有账号数组');
    }
    const r = await api('POST', '/api/yyb/accounts/import', { accounts });
    const lines = ['✅ 导入完成：新建 ' + (r.created || 0) + ' 个，更新 ' + (r.updated || 0) + ' 个'];
    if (r.skipped && r.skipped.length) {
      lines.push('⚠️ 跳过 ' + r.skipped.length + ' 个：' + r.skipped.slice(0, 3).map((s) => {
        const who = s.openid ? s.openid.slice(0, 12) + '…' : '未知';
        return who + '（' + (s.reason || '原因未知') + '）';
      }).join('；'));
    }
    show(acctOut, 'ok', lines);
    if (r.accounts) renderAccounts(r.accounts);
  } catch (e) {
    show(acctOut, 'err', ['导入失败：' + e.message]);
  } finally {
    input.value = '';   // 允许重复选同一个文件
  }
}

async function removeAccount(btn, a) {
  const name = a.nickname || a.alias || a.openid || ('#' + a.ref);
  if (!confirm('确定删除账号「' + name + '」？删除后青龙脚本将不再使用它，需要重新扫码才能恢复。')) return;
  btn.disabled = true;
  show(acctOut, 'info', ['正在删除…']);
  try {
    await api('DELETE', '/api/yyb/accounts?ref=' + encodeURIComponent(a.ref));
    // 先刷新列表（loadAccounts 成功时会清空 acctOut），再显示结果，
    // 否则「已删除」会被随后的刷新清掉，看起来像没生效
    await loadAccounts();
    show(acctOut, 'ok', ['已删除：' + name]);
  } catch (e) {
    show(acctOut, 'err', [e.message]);
  }
  btn.disabled = false;
}

/* ---------- 引导 ---------- */

async function boot() {
  let h;
  try {
    h = await api('GET', '/api/admin/health');
  } catch (e) {
    document.body.classList.remove('admin');
    app.innerHTML = '';
    app.appendChild(node('div', { class: 'wrap' }, [noteBox('err', ['无法连接面板服务：' + e.message])]));
    return;
  }
  if (h.needsSetup) return renderAuth('setup');
  if (!h.loggedIn) return renderAuth('login');

  try {
    cfg = await api('GET', '/api/admin/config');
  } catch (e) {
    return renderAuth('login');
  }
  renderShell();
}

// 手动改 hash（或浏览器前进后退）时同步切换面板
window.addEventListener('hashchange', () => {
  if (document.querySelector('.admin-shell')) activateFromHash();
});

boot();
</script>
