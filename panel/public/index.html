<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码登录面板</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <h1 class="page-title">扫码登录面板</h1>
  <p class="page-sub">选一个平台扫码，登录成功后凭据会自动写进青龙面板。</p>

  <div id="banner"></div>

  <!-- 第一步：选平台 -->
  <section id="viewPick">
    <div class="pick-grid">
      <button class="pick-card" data-mode="yyb">
        <span class="pick-icon yyb" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 8.5 12 4l9 4.5-9 4.5-9-4.5Z"/>
            <path d="M3 8.5v7L12 20l9-4.5v-7"/>
            <path d="M12 13v7"/>
          </svg>
        </span>
        <span class="pick-body">
          <span class="pick-title">应用宝扫码</span>
          <span class="pick-desc">微信扫码授权 · 账号保存在网关</span>
        </span>
        <span class="pick-arrow" aria-hidden="true">›</span>
      </button>

      <button class="pick-card" data-mode="meituan">
        <span class="pick-icon mt" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 8h14l-1 12H6L5 8Z"/>
            <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
          </svg>
        </span>
        <span class="pick-body">
          <span class="pick-title">美团扫码</span>
          <span class="pick-desc">美团 App 扫码 · 写入 MT_TOKEN</span>
        </span>
        <span class="pick-arrow" aria-hidden="true">›</span>
      </button>
    </div>

    <div class="note info">扫码全程只把凭据写进你自己的青龙面板，不经过任何第三方服务。</div>
  </section>

  <!-- 第二步：扫码 -->
  <section id="viewScan" class="hidden">
    <button class="back-link" id="backBtn">← 返回选择平台</button>
    <div class="card">
      <h2 id="scanTitle"></h2>
      <div class="hint" id="scanHint"></div>
      <div class="field" id="remarkRow" style="display:none">
        <label for="remarkInput">备注（选填）</label>
        <input id="remarkInput" type="text" maxlength="64" autocomplete="off"
               placeholder="手机号 / 昵称。会写进青龙那条 MT_TOKEN 的备注；留空自动用「美团账号 N」">
      </div>
      <div class="qr-box" id="qrBox">正在生成二维码…</div>
      <div class="status pending" id="status"></div>
      <div class="countdown" id="countdown"></div>
      <div class="center row" style="justify-content:center">
        <button class="btn small" id="restartBtn">重新生成二维码</button>
        <a class="btn small ghost" id="linkBtn" style="display:none" target="_blank" rel="noopener">在浏览器中打开授权链接</a>
      </div>
      <div id="result"></div>
    </div>
  </section>

  <div class="footer"><a href="/admin">管理后台</a></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const MODES = {
  yyb: { title: '应用宝扫码', hint: '请用手机微信扫描下方二维码，并在手机上确认登录。' },
  meituan: {
    title: '美团扫码',
    hint: '请用美团 App 扫描下方二维码，并在手机上确认登录。'
      + '每扫一次就是「新增一个账号」：登录后会在青龙里新增一条独立的 MT_TOKEN'
      + '（一个账号一条，可各自写备注），加完可以接着扫下一个。',
    remark: true,
  },
};

let mode = null;
let sid = null;
let stopped = true;
let cdTimer = null;
let secsLeft = 0;

async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(url, opts);
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok || !data || data.ok !== true) {
    const err = new Error((data && data.error) || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return data.data;
}

/* ---------- 通用渲染 ---------- */

function setStatus(text, cls) {
  const s = $('status');
  s.textContent = text || '';
  s.className = 'status ' + (cls || '');
}
function setQr(html) { $('qrBox').innerHTML = html; }
function clearResult() { $('result').innerHTML = ''; }

function note(kind, lines) {
  const box = document.createElement('div');
  box.className = 'note ' + kind;
  for (const line of (lines || [])) {
    // 允许传 null/undefined（例如 `cond ? '文案' : null`），直接跳过
    if (line === null || line === undefined || line === false || line === '') continue;
    const div = document.createElement('div');
    if (typeof line === 'string' || typeof line === 'number') div.textContent = String(line);
    else div.appendChild(line);
    box.appendChild(div);
  }
  $('result').appendChild(box);
}

function banner(kind, text) {
  const box = document.createElement('div');
  box.className = 'note ' + kind;
  box.style.marginTop = '0';
  box.style.marginBottom = '16px';
  box.textContent = text;
  $('banner').appendChild(box);
}

function kv(rows) {
  const t = document.createElement('table');
  t.className = 'kv';
  for (const [k, v] of rows) {
    const tr = document.createElement('tr');
    const td1 = document.createElement('td');
    td1.className = 'k';
    td1.textContent = k;
    const td2 = document.createElement('td');
    td2.textContent = v;
    tr.append(td1, td2);
    t.appendChild(tr);
  }
  return t;
}

/* ---------- 上传结果 ---------- */

function renderUpload(up) {
  if (!up) return ['ℹ️ 未上传（没有生成可写入的凭据）', 'info'];
  if (!up.ok) return [`❌ 写青龙失败：${up.error || '未知错误'}`, 'err'];
  const name = up.variable || '环境变量';
  if (up.skipped) return [`ℹ️ 青龙 ${name} 已存在，保持现有配置不动`, 'info'];
  if (up.action === 'created') {
    return [`✅ 已在青龙新增一条 ${name}（当前共 ${up.accountCount || 1} 个账号）`, 'ok'];
  }
  if (up.action === 'updated') return [`✅ 已更新青龙 ${name}`, 'ok'];
  if (up.action === 'appended') return [`✅ 已追加到青龙 ${name}（当前共 ${up.existingLines || 1} 行）`, 'ok'];
  if (up.action === 'unchanged') {
    return up.remarksPatched
      ? ['ℹ️ 这个账号青龙里已有，顺手把备注补上了', 'info']
      : [`ℹ️ 这个账号青龙里已经有了（共 ${up.accountCount || 1} 条 ${name}），没有重复添加`, 'info'];
  }
  return [`✅ 已写入青龙 ${name}`, 'ok'];
}

function renderUploadDetail(up) {
  if (!up || !up.ok) return null;
  const rows = [];
  if (up.host) rows.push(['青龙', up.host]);
  rows.push(['变量名', up.variable || '-']);
  if (up.remarks) rows.push(['备注', up.remarks]);
  rows.push(['token', up.masked || '****']);
  if (up.accountCount) rows.push(['账号总数', String(up.accountCount)]);
  return kv(rows);
}

/* ---------- 视图切换 ---------- */

function stopTimers() {
  if (cdTimer) clearInterval(cdTimer);
  cdTimer = null;
  stopped = true;
}

function showPick(push) {
  stopTimers();
  mode = null;
  sid = null;
  $('viewScan').classList.add('hidden');
  $('viewPick').classList.remove('hidden');
  if (push !== false) history.pushState({ view: 'pick' }, '', location.pathname);
}

function showScan(nextMode, push) {
  mode = nextMode;
  $('viewPick').classList.add('hidden');
  $('viewScan').classList.remove('hidden');
  $('scanTitle').textContent = MODES[nextMode].title;
  $('scanHint').textContent = MODES[nextMode].hint;
  $('remarkRow').style.display = MODES[nextMode].remark ? '' : 'none';
  if (push !== false) history.pushState({ view: 'scan', mode: nextMode }, '', '#' + nextMode);
  startScan();
}

function startScan() {
  if (mode === 'yyb') startYyb();
  else startMeituan();
}

/* ---------- 应用宝 ---------- */

async function startYyb() {
  stopTimers();
  clearResult();
  $('linkBtn').style.display = 'none';
  setQr('正在生成二维码…');
  setStatus('正在获取二维码…', 'pending');
  $('countdown').textContent = '';

  let r;
  try {
    r = await api('POST', '/api/yyb/qr');
  } catch (e) {
    setStatus('获取二维码失败', 'err');
    setQr('<span style="color:#d64545">×</span>');
    note('err', ['无法连上应用宝网关：' + e.message, '请确认 yyb_go 已启动，且管理后台里的网关地址正确。']);
    return;
  }

  sid = r.sid;
  setQr(r.imageBase64 ? '<img src="' + r.imageBase64 + '" alt="应用宝二维码">' : '<img src="' + r.imageUrl + '" alt="应用宝二维码">');
  setStatus('等待微信扫码…', 'pending');
  stopped = false;
  startCountdown(110, startYyb);
  pollYyb();
}

async function pollYyb() {
  while (!stopped && sid) {
    let st;
    try {
      st = await api('GET', '/api/yyb/poll?sid=' + encodeURIComponent(sid));
    } catch (e) {
      if (e.status === 404) { stopTimers(); setStatus('会话已过期，请重新生成二维码', 'err'); return; }
      await sleep(1500);
      continue;
    }
    if (stopped) return;

    if (st.status === 'pending') setStatus('等待微信扫码…', 'pending');
    else if (st.status === 'scanned') setStatus('已扫码，请在手机上确认登录', 'scanned');
    else if (st.status === 'authorized' || st.status === 'confirmed') {
      stopTimers();
      await finishYyb();
      return;
    } else if (st.status === 'cancelled') {
      stopTimers(); $('countdown').textContent = '';
      setStatus('已在手机上取消，请重新生成二维码', 'err');
      return;
    } else if (st.status === 'expired' || st.status === 'unknown') {
      stopTimers(); startYyb();
      return;
    }
    await sleep(1500);
  }
}

async function finishYyb() {
  setStatus('授权成功，正在写入青龙…', 'done');
  $('countdown').textContent = '';
  let r;
  try {
    r = await api('POST', '/api/yyb/confirm', { sid: sid });
  } catch (e) {
    setStatus('确认授权失败', 'err');
    note('err', [e.message, '如果是「buffer not ready」，稍等一下重新扫码即可。']);
    return;
  }
  setQr('<span class="tick">✓</span>');
  setStatus('✓ 添加完成', 'done');
  const acc = r.account || {};
  note('info', [kv([
    ['账号', acc.nickname || acc.openid || '-'],
    ['openid', acc.openid || '-'],
    ['状态', acc.status || '-'],
  ])]);
  note('info', ['账号已保存在网关，脚本会自动发现，无需改青龙配置。']);
  renderActions({ text: '想再挂一个账号，直接点下面按钮继续扫。' });
}

/* ---------- 美团 ---------- */

/**
 * 扫码结束后的两个出口：再加一个账号 / 回平台选择页。
 *
 * 「加新账号」直接重走一遍上方流程即可 —— 服务端 /api/meituan/start 现在一律走
 * 「新账号」流程（先把槽位里的旧账号落一次青龙，再清槽位取新的授权链接），
 * 前端不需要再传任何标志。
 */
function renderActions(opts) {
  const o = opts || {};
  const box = document.createElement('div');
  box.className = 'note info';

  if (o.text) {
    const p = document.createElement('div');
    p.textContent = o.text;
    box.appendChild(p);
  }

  const row = document.createElement('div');
  row.className = 'row';
  row.style.marginTop = '10px';

  const again = document.createElement('button');
  again.className = 'btn small';
  again.textContent = '➕ 扫码添加新账号';
  again.addEventListener('click', async () => {
    again.disabled = true;
    again.textContent = '正在准备新二维码…';
    await startScan();
  });

  const back = document.createElement('button');
  back.className = 'btn small ghost';
  back.textContent = '← 返回选择平台';
  back.addEventListener('click', () => showPick(true));

  row.append(again, back);
  box.appendChild(row);
  $('result').appendChild(box);
}

async function startMeituan() {
  stopTimers();
  clearResult();
  $('linkBtn').style.display = 'none';
  setQr('正在唤起美团登录…');
  setStatus('正在获取登录二维码…', 'pending');
  $('countdown').textContent = '';
  $('remarkRow').style.display = '';

  const remarks = ($('remarkInput').value || '').trim();

  let r;
  try {
    r = await api('POST', '/api/meituan/start', { remarks: remarks });
  } catch (e) {
    setStatus('获取二维码失败', 'err');
    setQr('<span style="color:#d64545">×</span>');
    note('err', [e.message]);
    renderActions({ text: '可以返回选择平台，或点下面按钮重试。' });
    return;
  }

  sid = r.sid;

  // 退化路径：本地单槽位缓存没清掉，切不到新账号（正常不该发生）
  if (r.mode === 'token') {
    setQr('<span class="tick">✓</span>');
    setStatus('没能切换到新账号', 'err');
    note('err', [r.degraded || '本地登录态没清干净，出不来新二维码。']);
    const [text, kind] = renderUpload(r.upload);
    note(kind, [text]);
    const detail = renderUploadDetail(r.upload);
    if (detail) note('info', [detail]);
    renderActions();
    return;
  }

  // 上一轮扫的账号还躺在专家包缓存里 —— 已顺手存进青龙，这里告知一声
  if (r.savedOld && r.savedOld.ok && r.savedOld.action === 'created') {
    note('info', [`🔁 上一次扫的账号还没入库，已顺手写进青龙 MT_TOKEN（当前共 ${r.savedOld.accountCount || 1} 个）。`]);
  }

  if (r.imageUrl) setQr('<img src="' + r.imageUrl + '" alt="美团登录二维码">');
  else if (r.imageBase64) setQr('<img src="' + r.imageBase64 + '" alt="美团登录二维码">');
  else setQr('<span style="font-size:13px">二维码图片生成失败，请点下方按钮用美团 App 打开授权链接</span>');

  if (r.authUrl) {
    $('linkBtn').href = r.authUrl;
    $('linkBtn').style.display = '';
  }
  setStatus('等待美团 App 扫码…', 'pending');
  $('countdown').textContent = '链接有效期约 10 分钟，登录完成后会自动继续';
  stopped = false;
  pollMeituan();
}

async function pollMeituan() {
  while (!stopped && sid) {
    let st;
    try {
      st = await api('GET', '/api/meituan/status?sid=' + encodeURIComponent(sid));
    } catch (e) {
      if (e.status === 404) { stopTimers(); setStatus('会话已过期，请重新生成二维码', 'err'); return; }
      await sleep(2000);
      continue;
    }
    if (stopped) return;

    if (st.status === 'running') { setStatus('等待扫码授权…', 'pending'); await sleep(2000); continue; }

    stopTimers();
    $('countdown').textContent = '';

    if (st.status === 'failed') {
      setStatus('登录失败', 'err');
      note('err', [st.message || '请重新生成二维码再试一次']);
      return;
    }

    setQr('<span class="tick">✓</span>');
    setStatus('✓ 登录成功', 'done');
    $('remarkInput').value = '';
    const [text, kind] = renderUpload(st.upload);
    note(kind, [text]);
    const detail = renderUploadDetail(st.upload);
    if (detail) note('info', [detail]);
    renderActions({ text: '想再挂一个账号，直接点下面按钮继续扫；已经入库的账号不会受影响。' });
    return;
  }
}

/* ---------- 二维码倒计时 ---------- */

function startCountdown(seconds, onExpire) {
  secsLeft = seconds;
  $('countdown').textContent = '二维码 ' + secsLeft + 's 后自动刷新';
  cdTimer = setInterval(() => {
    secsLeft -= 1;
    $('countdown').textContent = secsLeft > 0 ? ('二维码 ' + secsLeft + 's 后自动刷新') : '二维码已过期，正在刷新…';
    if (secsLeft <= 0) { clearInterval(cdTimer); cdTimer = null; onExpire(); }
  }, 1000);
}

/* ---------- 交互与路由 ---------- */

for (const card of document.querySelectorAll('.pick-card')) {
  card.addEventListener('click', () => showScan(card.dataset.mode, true));
}
$('backBtn').addEventListener('click', () => showPick(true));
$('restartBtn').addEventListener('click', () => { stopTimers(); startScan(); });

window.addEventListener('popstate', () => {
  const hash = location.hash.replace('#', '');
  if (MODES[hash]) showScan(hash, false);
  else showPick(false);
});

window.addEventListener('beforeunload', stopTimers);

(async () => {
  const hash = location.hash.replace('#', '');
  if (MODES[hash]) showScan(hash, false);
  else showPick(false);

  try {
    const h = await api('GET', '/api/health');
    if (h.needsSetup) banner('warn', '管理员还没有设置密码，请先打开 /admin 完成初始化，否则扫码结果无法写入青龙。');
    else if (!h.qinglongConfigured) banner('warn', '还没配置青龙面板（host / Client ID / Client Secret），扫码成功后无法自动上传，请先到 /admin 配置。');
  } catch (_) { /* 健康检查失败不阻断扫码 */ }
})();
</script>
</body>
</html>
